name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  library:
    name: Library (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor the library declares, and the current release.
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.1"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      # The formatter's output can differ between Elixir versions, so the
      # check runs on one of them only.
      - run: mix format --check-formatted
        if: matrix.elixir == '1.19.5'

      - run: mix compile --warnings-as-errors

      - run: mix test

  quality:
    name: Credo and Dialyzer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-quality-

      - run: mix deps.get

      - run: mix credo --strict

      # The PLT is the expensive part and is cached above; the analysis
      # itself takes seconds.
      - run: mix dialyzer --format github

  demo:
    name: Demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            demo/deps
            demo/_build
          key: ${{ runner.os }}-demo-${{ hashFiles('demo/mix.lock', 'mix.exs') }}
          restore-keys: ${{ runner.os }}-demo-

      - name: Install npm dependencies
        working-directory: demo
        # npm lives at the app root, not under assets/: Coelho's hook is
        # outside the app and imports ProseMirror by bare specifier, and Node
        # resolution walks up from the importing file. See demo/README.md.
        run: npm ci

      # The demo is a separate Mix project, so the library job above never
      # runs any of this. The steps mirror the demo's own `precommit` alias,
      # spelled out rather than invoked: `precommit` runs `format` and
      # `deps.unlock --unused`, which rewrite files instead of checking them,
      # so it would pass on unformatted code.
      - name: Compile, check formatting, test
        working-directory: demo
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix format --check-formatted
          mix test

      - name: Build assets
        working-directory: demo
        # The only step that proves the hook and its ProseMirror imports
        # actually bundle.
        run: |
          mix assets.setup
          mix assets.build

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The demo has to actually run, which it does in dev.
    env:
      MIX_ENV: dev
      BROWSER: ${{ matrix.browser }}
      # Said out loud, because the steps below assert it twice — the curl
      # that waits for the server, and BASE_URL. The demo asks AutoPort for a
      # free port when nobody has named one, which on a fresh runner answers
      # 4321 and on a busy one would not.
      PORT: "4321"

    strategy:
      fail-fast: false
      matrix:
        # contenteditable and selection are where browsers disagree, which is
        # where every bug this suite has found was hiding.
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      # `mix assets.setup` fetches the Tailwind and esbuild binaries from
      # GitHub's release downloads, and this was the only job of the three
      # not to keep them: every run asked for them again, three times over in
      # parallel, and a 504 from GitHub failed the lot. They live in
      # `demo/_build`.
      #
      # The three browsers share a key on purpose — the binaries are the same
      # for all of them. On a cold run all three try to save it and two are
      # told another job got there first, which is a warning and not a
      # failure.
      - uses: actions/cache@v4
        with:
          path: |
            demo/deps
            demo/_build
          key: ${{ runner.os }}-browser-${{ hashFiles('demo/mix.lock', 'mix.exs') }}
          restore-keys: ${{ runner.os }}-browser-

      - name: Install dependencies
        working-directory: demo
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
          mix deps.get
          mix assets.setup
          mix assets.build

      # Everything else proves the halves fit. This proves the thing runs:
      # typing, the round trip to the server, marks, undo, an upload stored
      # and served back through a signed URL, and a pasted image captured.
      - name: Drive the editor in a real browser
        working-directory: demo
        run: |
          mix phx.server > /tmp/demo.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:${PORT}/" && break
            sleep 1
          done
          # The loop cannot fail on its own: it runs out of tries and falls
          # through, and the suite then fails with a connection error rather
          # than with the reason. Say it here, the way docker/check.sh does.
          if ! curl -sf -o /dev/null "http://localhost:${PORT}/"; then
            echo "the demo never came up on port ${PORT}:"
            tail -30 /tmp/demo.log
            exit 1
          fi
          BASE_URL="http://localhost:${PORT}" npm run test:browser

  bridge:
    name: Schema bridge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install npm dependencies
        working-directory: demo
        run: npm ci

      # The schema is declared in Elixir and exported to the browser, but
      # toDOM/parseDOM are functions and live in assets/js/coelho.js. This
      # feeds the real exported JSON to the real browser code and builds an
      # actual ProseMirror schema — the drift test in the library only
      # compares names. `extended.json` is an application's schema, with
      # marks the library has never heard of.
      - name: Check both halves agree
        working-directory: demo
        run: |
          # Node's ESM loader ignores NODE_PATH, so the library's own assets
          # directory needs the modules reachable by walking up from it.
          ln -sfn "$PWD/node_modules" ../assets/node_modules
          mix deps.get
          mix run priv/check/export_schemas.exs schema.json document.json extended.json
          node priv/check/schema_bridge.mjs schema.json document.json extended.json
